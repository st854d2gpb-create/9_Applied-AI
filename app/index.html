<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Baumarkt-Buddy – DIY shopping list checked by fixed rules (university prototype, sample data)">
  <!-- NFR-06/NFR-07: no inline scripts, no third-party origins. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.workers.dev; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Baumarkt-Buddy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <div class="brand">
      <!-- Own neutral mark (toolbox line icon) – no logo or mascot of a real company -->
      <span class="brand-mark" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><path class="icon-accent" d="M3 12h18v3H3z"/><path d="M3 9h18v10H3z"/><path d="M9 9V6.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5V9"/><path d="M10 13.5h4"/></svg>
      </span>
      <div class="brand-text">
        <h1 id="app-title">Baumarkt-Buddy</h1>
        <p id="app-tagline" class="tagline"></p>
        <span id="sample-badge" class="badge">Sample data</span>
      </div>
    </div>
    <div class="header-actions">
      <button id="lang-toggle" class="round-btn" type="button">DE</button>
    </div>
  </header>

  <nav id="progress" class="progress" aria-label="Progress" hidden></nav>

  <main id="main" tabindex="-1" aria-live="polite"></main>

  <footer class="app-footer"><p id="footer-text"></p></footer>

  <nav id="tab-bar" class="tab-bar" aria-label="Navigation" hidden></nav>

  <!-- Order matters: config → libs → data → rules → texts → app -->
  <script src="config.js"></script>
  <script src="lib/xlsx.mini.min.js"></script>
  <script src="data.js"></script>
  <script src="rules.js"></script>
  <script src="ai-adapter.js"></script>
  <script src="speech.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
